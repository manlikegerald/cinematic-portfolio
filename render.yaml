databases:
  - name: cinematic-portfolio-db
    databaseName: portfolio
    user: portfolio

services:
  # FastAPI backend
  - type: web
    name: cinematic-portfolio-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: cinematic-portfolio-db
          property: connectionString
      # Public URL of the static site below, e.g. https://cinematic-portfolio.onrender.com
      # (comma-separate to also allow a custom domain). Prompted for on first Blueprint sync.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Set in the dashboard — never commit this.
      - key: ADMIN_PASSWORD
        sync: false

  # Vite/React frontend
  - type: web
    name: cinematic-portfolio
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22
      # Public URL of the API service plus /api, e.g. https://cinematic-portfolio-api.onrender.com/api
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
